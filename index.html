<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirmes Beta Launcher</title>
    <style>
        body {
            background-color: #18181b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .window {
            width: 800px;
            height: 450px;
            background-color: #27272a;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid #3f3f46;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: #f43f5e;
        }

        .content {
            color: #a1a1aa;
            font-size: 16px;
        }

        .footer {
            display: flex;
            justify-content: flex-end;
        }

        .btn-play {
            background-color: #f43f5e;
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-play:hover {
            background-color: #e11d48;
        }

        .btn-play:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="header">
            <h1>Kirmes Beta Launcher</h1>
        </div>

        <div class="content">
            <p>Willkommen beim Launcher! Überprüfe auf Updates und starte das Spiel.</p>
            <p id="status-text">Status: Bereit zum Starten</p>
        </div>

        <div class="footer">
            <button class="btn-play" id="playBtn">SPIELEN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
